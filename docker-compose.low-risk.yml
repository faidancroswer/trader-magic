services:
  data_retrieval:
    build:
      context: .
      dockerfile: Dockerfile
    image: trader-magic/data-retrieval
    container_name: data_retrieval_low_risk
    volumes:
      - ./:/app
    command: python -m src.data_retrieval.service
    env_file:
      - .env.low-risk
    environment:
      - SERVICE_NAME=data_retrieval
      - PYTHONPATH=/app
    depends_on:
      - redis
    networks:
      - trader_network_low_risk
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai_decision:
    build:
      context: .
      dockerfile: Dockerfile
    image: trader-magic/ai-decision
    container_name: ai_decision_low_risk
    volumes:
      - ./:/app
    command: python -m src.ai_decision.service
    env_file:
      - .env.low-risk
    environment:
      - SERVICE_NAME=ai_decision
      - PYTHONPATH=/app
    depends_on:
      - ollama
      - ollama_init
      - redis
    networks:
      - trader_network_low_risk
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  trade_execution:
    build:
      context: .
      dockerfile: Dockerfile
    image: trader-magic/trade-execution
    container_name: trade_execution_low_risk
    volumes:
      - ./:/app
    command: python -m src.trade_execution.service
    env_file:
      - .env.low-risk
    environment:
      - SERVICE_NAME=trade_execution
      - PYTHONPATH=/app
    depends_on:
      - redis
    networks:
      - trader_network_low_risk
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: trader-magic/frontend
    container_name: frontend_low_risk
    ports:
      - "9753:9753"
    volumes:
      - ./frontend:/app/frontend
      - ./.env.low-risk:/app/.env
    env_file:
      - .env.low-risk
    environment:
      - SERVICE_NAME=frontend
      - PYTHONPATH=/app
    command: python /app/frontend/app.py
    depends_on:
      - redis
    networks:
      - trader_network_low_risk
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_low_risk
    volumes:
      - ollama_data_low_risk:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - trader_network_low_risk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        
  ollama_init:
    image: curlimages/curl:latest
    container_name: ollama_init_low_risk
    volumes:
      - ./scripts:/scripts
    command: sh /scripts/init-ollama.sh
    environment:
      - OLLAMA_MODEL=llama3.2:1b
    depends_on:
      - ollama
    networks:
      - trader_network_low_risk
    restart: "no"

  redis:
    image: redis:alpine
    container_name: redis_low_risk
    ports:
      - "6379:6379"
    volumes:
      - redis_data_low_risk:/data
    command: redis-server --notify-keyspace-events KEA
    networks:
      - trader_network_low_risk
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trader_network_low_risk:
    driver: bridge

volumes:
  ollama_data_low_risk:
  redis_data_low_risk: